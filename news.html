<div id="top"><noscript><h1>Announcements</h1><h2>28.10.2026 Electronic bidding from 2027: seminars for procuring entities</h2><p>From 16 November to 18 December 2026 the Department holds seminars on electronic bidding for the staff of procuring entities at Government House, Talas, and at Nurzhan City Hall. Until electronic bidding opens, bids are accepted on paper only.</p><h2>21.09.2026 Reminder: bids in the state language</h2><p>Under article 17(4) of the Act, bids and the documents attached to them are submitted in the state language. A document in another language must be accompanied by a certified translation. Bids that do not meet this requirement are rejected at opening.</p><h2>01.07.2026 List of unreliable suppliers updated</h2><p>A supplier on the list may not take part in public procurement for two years (art. 43). Procuring entities must check the list before signing a contract.</p><h2>03.11.2025 New version of the portal</h2><p>From 3 November 2025 the portal publishes, for every procurement, the bids received and the contract signed, as well as the register of suppliers and the list of unreliable suppliers. Notices published before this date are kept by the procuring entities.</p><h2>01.07.2021 Amendments to the Public Procurement Act</h2><p>The amendments to the Public Procurement Act 2015 enter into force. Request for quotations may now be used for purchases up to 2,500,000 som. The Rules page has been updated.</p><h2>30.03.2020 Bids during the quarantine regime</h2><p>During the quarantine regime bids in sealed envelopes are accepted at the entrance of the procuring entity's building. Bids are opened without the public, and the minutes are published on the portal.</p><h2>01.02.2016 The State Procurement Portal opens</h2><p>Under the Public Procurement Act 2015, notices of open tenders and requests for quotations of the state bodies of the ISEZ are published on this portal. Bids are submitted on paper at the address of the procuring entity.</p></noscript></div>
